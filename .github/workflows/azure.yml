# Tests Day-Trader and deploys it to Azure App Service on every push to main.
# It can also be run by hand from the Actions tab ("Run workflow").
#
# One-time setup (see README.md, "Deploy to Azure"):
#
# 1. Create a Linux App Service web app named AZURE_WEBAPP_NAME (below) with
#    the Node 20 LTS runtime.
# 2. In the web app's Configuration, add the app setting
#    WEBSITE_WEBDEPLOY_USE_SCM = true, then download its publish profile.
# 3. Add the publish profile's contents as the repository secret
#    AZURE_WEBAPP_PUBLISH_PROFILE.
#
# Until that secret exists, the workflow still runs the tests but skips the
# deploy step with a warning.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: day-trader       # the web app's name (<name>.azurewebsites.net)
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # path to the app, relative to the repository root
  NODE_VERSION: '20.x'                # keep in line with the web app's runtime

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm test
    - name: Skip deploy (publish profile not configured)
      if: env.PUBLISH_PROFILE == ''
      run: echo "::warning::AZURE_WEBAPP_PUBLISH_PROFILE secret is not set, so the deploy was skipped. See README.md, 'Deploy to Azure'."
    - name: Deploy to Azure WebApp
      if: env.PUBLISH_PROFILE != ''
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ env.PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
